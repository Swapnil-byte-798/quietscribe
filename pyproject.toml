[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "quietscribe"
version = "0.1.0"
description = "On-device speech transcription and encrypted transcript storage"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3", "faster-whisper>=1.2,<1.3", "huggingface-hub>=0.24,<1", "requests[socks]>=2.31", "cryptography>=44"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
quietscribe = "quietscribe.cli:main"
[tool.setuptools.packages.find]
include = ["quietscribe*"]
[tool.setuptools.package-data]
quietscribe = ["*.sql", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
